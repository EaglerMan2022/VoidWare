<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="VoidWare — a simple, searchable arcade of browser games.">
  <title>VoidWare — Unblocked Games</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button class="menu-button" id="menu-button" type="button" aria-label="Open game categories" aria-expanded="false" aria-controls="category-menu"><span></span><span></span><span></span></button>
    <a class="brand" href="./" aria-label="VoidWare home"><span class="brand-icon" aria-hidden="true">V</span><span>void<span class="brand-ware">ware</span></span></a>
    <form class="search-form" id="search-form" role="search"><label class="visually-hidden" for="game-search">Search games</label><input id="game-search" type="search" placeholder="Search games" autocomplete="off"><button type="button" id="clear-search" class="clear-search" aria-label="Clear search" hidden>×</button></form>
    <nav class="main-nav" aria-label="Game categories">
      <button class="nav-link" type="button" data-filter="new">New Games</button>
      <button class="nav-link active" type="button" data-filter="all">Unblocked Games</button>
      <button class="nav-link" type="button" data-filter="math">Math Games</button>
    </nav>
    <a class="favorites-link" href="#games" id="favorites-link"><span aria-hidden="true">♥</span> Favorites</a>
    <div class="category-menu" id="category-menu" hidden><button type="button" data-filter="all">All games</button><button type="button" data-filter="new">New games</button><button type="button" data-filter="math">Math games</button><button type="button" data-filter="favorites">Favorites</button></div>
  </header>
  <main>
    <section class="catalog" id="games" aria-label="Game catalog">
      <div class="catalog-heading"><div><p class="eyebrow" id="catalog-eyebrow">TAKE A BREAK</p><h1 id="catalog-title">Unblocked Games</h1></div><p class="results-count" id="results-count" aria-live="polite"></p></div>
      <div class="games-grid" id="games-grid" aria-live="polite"></div>
      <section class="empty-state" id="empty-state" hidden><div class="empty-icon" aria-hidden="true">⌕</div><h2 id="empty-title">No games yet</h2><p id="empty-message">The game shelves are empty for now. Add a game folder to the catalog and it will appear here.</p><a class="clear-link" id="clear-link" href="#games" hidden>Clear search <span>↗</span></a></section>
      <p class="catalog-note" id="catalog-note">New games will show up here as the arcade grows.</p>
    </section>
  </main>
  <footer class="footer"><a class="footer-brand" href="./">void<span>ware</span></a><span>Just games. No downloads.</span><span>© <span id="year"></span> VOIDWARE</span></footer>
</body>
</html>
